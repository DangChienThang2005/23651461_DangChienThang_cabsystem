paths:
  /api/dispatch/drivers/match:
    post:
      tags:
      - Driver Matching
      summary: Xác định tài xế phù hợp
      description: 'FR09 - BR03.1: Xác định tài xế phù hợp.'
      operationId: fr09
      x-fr-id: FR09
      x-sub-requirement: BR03.1
      x-acceptance-criteria:
      - AC-05
      responses:
        '200':
          description: Đã xác định tài xế phù hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverList'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverMatchRequest'
  /api/dispatch/drivers/location:
