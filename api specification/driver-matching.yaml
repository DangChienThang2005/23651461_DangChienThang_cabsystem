        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: &id001
      - name: rideId
        in: path
        required: true
        description: Mã chuyến đi
        schema:
          type: string
        example: CH001
