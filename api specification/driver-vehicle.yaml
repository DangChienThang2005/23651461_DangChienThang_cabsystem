paths:
  /api/drivers/register:
    post:
      tags:
      - Driver & Vehicle
      summary: Đăng ký tài xế
      description: 'FR37 - BR08.1: Đăng ký tài xế.'
      operationId: fr37
      x-fr-id: FR37
      x-sub-requirement: BR08.1
      x-acceptance-criteria:
      - AC-20
      responses:
        '200':
          description: Đăng ký tài xế thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
