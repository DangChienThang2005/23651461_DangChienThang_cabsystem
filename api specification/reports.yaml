paths:
  /api/reports/rides/count:
    get:
      tags:
      - Reports
      summary: Báo cáo số lượng chuyến
      description: 'FR51 - BR10.1: Báo cáo số lượng chuyến.'
      operationId: fr51
      x-fr-id: FR51
      x-sub-requirement: BR10.1
      x-acceptance-criteria:
      - AC-24
      responses:
        '200':
          description: Báo cáo được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: &id001
      - name: fromDate
        in: query
        required: false
        description: Ngày bắt đầu kỳ báo cáo
        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: toDate
        in: query
        required: false
        description: Ngày kết thúc kỳ báo cáo
        schema:
          type: string
          format: date
        example: '2026-09-30'
